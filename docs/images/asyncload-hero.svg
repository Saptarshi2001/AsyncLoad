<svg width="1100" height="360" viewBox="0 0 1100 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1100" height="360" rx="22" fill="#11111B"/>
  <rect x="18" y="18" width="1064" height="324" rx="16" fill="#1E1E2E" stroke="#BD93F9" stroke-width="2"/>
  <rect x="18" y="18" width="1064" height="44" rx="16" fill="#181825"/>
  <circle cx="48" cy="40" r="7" fill="#FF5555"/>
  <circle cx="72" cy="40" r="7" fill="#F1FA8C"/>
  <circle cx="96" cy="40" r="7" fill="#50FA7B"/>
  <text x="130" y="46" fill="#CBA6F7" font-family="Consolas, 'Courier New', monospace" font-size="16">asyncload://terminal</text>

  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="titleGradient" x1="90" y1="118" x2="1010" y2="252" gradientUnits="userSpaceOnUse">
      <stop stop-color="#50FA7B"/>
      <stop offset="0.28" stop-color="#8BE9FD"/>
      <stop offset="0.62" stop-color="#BD93F9"/>
      <stop offset="1" stop-color="#FF79C6"/>
    </linearGradient>
  </defs>

  <text x="550" y="158" text-anchor="middle" fill="#6272A4" font-family="Consolas, 'Courier New', monospace" font-size="18" letter-spacing="5">LOAD TESTING IN STYLE</text>
  <text x="550" y="232" text-anchor="middle" fill="url(#titleGradient)" stroke="#F8F8F2" stroke-width="1.2" paint-order="stroke" filter="url(#glow)" font-family="Consolas, 'Courier New', monospace" font-size="86" font-weight="800" letter-spacing="2">AsyncLoad</text>
  <text x="550" y="276" text-anchor="middle" fill="#F1FA8C" font-family="Consolas, 'Courier New', monospace" font-size="20">[ async http load testing :: mongodb history :: retro tui metrics ]</text>

  <path d="M80 300H1020" stroke="#44475A" stroke-width="1"/>
  <text x="82" y="324" fill="#50FA7B" font-family="Consolas, 'Courier New', monospace" font-size="16">$ asyncload https://jsonplaceholder.typicode.com/posts -n 100 -c 10 -GET</text>
  <text x="870" y="324" fill="#FF79C6" font-family="Consolas, 'Courier New', monospace" font-size="16">READY</text>
</svg>
