[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "AsyncLoad"
version = "0.1.4"
description = "Asynchronous HTTP Load Testing Tool with Database Storage and Betterstack Integration"
readme = "README.MD"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [
    {name = "Saptarshi Dutta", email = "saptarshidutta2001@gmail.com"},
]
maintainers = [
    {name = "Saptarshi Dutta", email = "saptarshidutta2001@gmail.com"},
]
keywords = ["load-testing", "http", "async", "aiohttp", "performance", "monitoring", "betterstack"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development :: Testing :: Traffic Generation",
    "Topic :: System :: Benchmark",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
    "Framework :: AsyncIO",
]

dependencies = [
    "aiohttp>=3.7.0",
    "requests>=2.25.0",
    "python-dotenv>=0.15.0",
    "logtail-python>=0.3.4",
    "textual>=8.0.0",
    "pymongo>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0.0",
    "pytest-asyncio>=0.14.0",
    "coverage>=5.0.0",
    "black>=21.0.0",
    "flake8>=3.8.0",
]
test = [
    "pytest>=6.0.0",
    "pytest-asyncio>=0.14.0",
]

[project.urls]
Homepage = "https://github.com/Saptarshi2001/AsyncLoad"
Documentation = "https://github.com/Saptarshi2001/AsyncLoad#readme"
Repository = "https://github.com/Saptarshi2001/AsyncLoad"
Issues = "https://github.com/Saptarshi2001/AsyncLoad/issues"
Changelog = "https://github.com/Saptarshi2001/AsyncLoad/blob/main/CHANGELOG.md"

[project.scripts]
asyncload = "asyncload.cli:main"

[tool.setuptools]
include-package-data = true
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*", "docs*"]

[tool.setuptools.package-data]
asyncload = ["*.tcss"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["src"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.coverage.run]
source = ["src/asyncload"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]
